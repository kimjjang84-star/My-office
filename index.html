<!doctype html>
<html lang="ko">
<head>

<title>MY AI OFFICE | AI 회사형 웹사이트 시제품</title>
<style>
:root{--ink:#172233;--muted:#6f7a8b;--bg:#f5f7fb;--line:#e4e8f0;--white:#fff;--primary:#496cf1;--deep:#1d2b56;--green:#168769;--amber:#9b6b1d;--blue-bg:#edf2ff;--radius:16px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #86a5ff;outline-offset:2px}.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}.sidebar{background:#17253f;color:#e8eef9;padding:27px 17px;display:flex;flex-direction:column;gap:24px}.brand{display:flex;align-items:center;gap:11px;padding:0 12px}.brandmark{width:40px;height:40px;display:grid;place-items:center;background:linear-gradient(145deg,#7893ff,#4972ed);border-radius:12px;font-size:19px}.brand strong{display:block;font-size:16px;letter-spacing:-.4px}.brand small{display:block;color:#a6b6d4;font-size:11px;margin-top:3px}.sidehead{padding:0 12px;color:#8498bb;font-size:10px;font-weight:800;letter-spacing:1.5px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#bfd0e8;border-radius:10px;text-align:left;padding:12px 13px;display:flex;align-items:center;gap:12px;font-weight:650}.nav button.active,.nav button:hover{color:#fff;background:#2b3d60}.nav button span:first-child{font-size:16px;width:22px;text-align:center}.sidefoot{margin-top:auto;border-top:1px solid #30415e;padding:17px 12px 5px;color:#9baac6;font-size:11px;line-height:1.7}.content{min-width:0}.topbar{background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);padding:18px 30px;display:flex;align-items:center;justify-content:space-between;gap:20px}.breadcrumb{color:var(--muted);font-size:12px;margin-bottom:4px}.pagetitle{font-size:22px;font-weight:800;letter-spacing:-.7px}.rightactions{display:flex;align-items:center;gap:12px}.avatar{display:grid;place-items:center;border:1px solid #d7dfed;background:#e9effe;color:#3052a8;width:37px;height:37px;border-radius:11px;font-weight:800}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;color:var(--ink);font-weight:700;transition:.16s}.btn:hover{filter:brightness(.96)}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.soft{background:#edf2ff;color:#3655ba;border-color:#dde6ff}.btn.danger{color:#b84a41;border-color:#f4d4d1}.btn.small{font-size:12px;padding:7px 10px}.main{padding:28px 30px 55px;max-width:1450px;margin:auto}.demo{border:1px solid #dce4fa;background:#eef3ff;color:#4660a9;border-radius:10px;padding:10px 13px;margin-bottom:22px;font-size:12px;display:flex;justify-content:space-between;gap:9px}.greeting{margin-bottom:23px}.greeting h1{font-size:26px;letter-spacing:-1px;margin:0 0 6px}.greeting p{color:var(--muted);margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:21px 0 25px}.stat{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:20px}.stat .label{color:var(--muted);font-size:12px}.stat .value{font-size:29px;font-weight:800;letter-spacing:-1px;margin-top:12px}.stat .sub{font-size:11px;color:#8090a0;margin-top:5px}.section-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:0 0 14px}.section-head h2{font-size:16px;letter-spacing:-.4px;margin:0}.muted{color:var(--muted)}.layout2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.9fr);gap:20px}.panel{border:1px solid var(--line);background:#fff;border-radius:var(--radius);padding:20px;min-width:0}.panel + .panel{margin-top:0}.tasks{display:grid;gap:12px}.task{border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;gap:12px;justify-content:space-between;align-items:center}.task strong{display:block;font-size:13px;margin-bottom:6px}.task small{color:var(--muted);font-size:11px}.taskright{display:flex;align-items:center;gap:8px;flex-shrink:0}.pill{display:inline-block;border-radius:100px;font-size:11px;padding:5px 9px;font-weight:750;background:#edf2fa;color:#62718a;white-space:nowrap}.pill.active{background:#e9f3ff;color:#2c67a3}.pill.review{background:#fff4dd;color:#98691b}.pill.done{background:#e7f7f0;color:#188361}.pill.todo{background:#eff2f5;color:#596c82}.workflow{display:grid;gap:11px}.step{display:flex;align-items:flex-start;gap:12px}.num{display:grid;place-items:center;color:#4669d7;background:#edf2ff;width:28px;height:28px;flex:none;border-radius:9px;font-weight:800}.step strong{font-size:13px}.step p{font-size:11px;margin:4px 0;color:var(--muted);line-height:1.5}.membergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.member{background:white;border:1px solid var(--line);border-radius:var(--radius);padding:20px;min-width:0}.memberheader{display:flex;gap:12px;align-items:center}.member .emoji{display:grid;place-items:center;background:#eef3fc;font-size:25px;width:49px;height:49px;border-radius:13px}.member h3{margin:0 0 4px;font-size:14px}.member p{font-size:12px;color:var(--muted);line-height:1.65;min-height:40px;margin:17px 0}.meta{font-size:11px;color:var(--muted);line-height:1.7}.memberfoot{margin-top:15px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.filters{display:flex;gap:8px;margin-bottom:17px;flex-wrap:wrap}.filters button{border:1px solid var(--line);background:white;border-radius:9px;padding:9px 12px;color:#56657a;font-weight:650}.filters button.selected{background:#edf2ff;color:#3556d8;border-color:#d7e0ff}.tablewrap{overflow:auto}.datatable{width:100%;border-collapse:collapse;min-width:680px}.datatable th{text-align:left;font-size:11px;color:#79869a;padding:15px 11px;background:#f9fafd;font-weight:700}.datatable td{padding:15px 11px;border-top:1px solid #eff1f5;font-size:12px;vertical-align:middle}.datatable strong{font-size:13px}.datatable small{display:block;color:var(--muted);margin-top:5px}.empty{border:1px dashed #cad5e5;border-radius:14px;padding:42px 20px;text-align:center;color:var(--muted)}.projectgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.project{background:#fff;border-radius:var(--radius);border:1px solid var(--line);padding:20px}.project h3{margin:11px 0;font-size:16px}.project p{font-size:12px;color:var(--muted);min-height:36px;line-height:1.65}.progress{height:7px;border-radius:10px;background:#edf0f6;overflow:hidden;margin:18px 0 10px}.bar{height:100%;background:#6483ed}.timeline{display:grid;gap:0}.event{display:grid;grid-template-columns:15px 1fr;gap:12px}.event .dot{width:10px;height:10px;background:#a6b9f5;border-radius:50%;margin-top:7px}.event .body{border-left:1px solid #dce2ef;padding:0 0 24px 17px;margin-left:-23px;position:relative;left:23px}.event strong{font-size:12px}.event p{font-size:11px;color:var(--muted);margin:6px 0}.settingsbox{display:grid;grid-template-columns:1fr 1fr;gap:15px}.config{border:1px solid var(--line);background:#fff;padding:23px;border-radius:var(--radius)}.config strong{display:block;margin-bottom:9px}.config p{color:var(--muted);line-height:1.7;font-size:12px}.modalwrap{position:fixed;inset:0;background:rgba(19,28,47,.62);z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}.modal{width:min(560px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:27px;box-shadow:0 25px 80px #111b3052}.modal h2{margin:0 0 8px;letter-spacing:-.4px}.modal .hint{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:22px}.field{display:grid;gap:6px;margin-bottom:15px}.field label{font-size:12px;font-weight:750}.field input,.field textarea,.field select{width:100%;border:1px solid #d8dfeb;border-radius:9px;padding:12px;color:var(--ink);background:white;outline-color:#829aff}.field textarea{resize:vertical;min-height:108px}.modalactions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.detailbox{border:1px solid var(--line);background:#f9fafc;border-radius:12px;padding:15px;line-height:1.8;font-size:12px;white-space:pre-wrap}.detailsteps{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}.detailsteps span{background:#eff3fb;border-radius:8px;padding:8px 9px;font-size:11px}.cta{display:flex;align-items:center;gap:15px;background:linear-gradient(110deg,#253a6f,#4a68be);color:#fff;border-radius:16px;padding:24px 25px;justify-content:space-between;margin:0 0 23px}.cta h2{margin:0 0 7px;font-size:18px}.cta p{margin:0;font-size:12px;color:#d7e2ff}.cta .btn{background:white;color:#3150a8}.hidden{display:none!important}.mobilebar{display:none}@media(max-width:1060px){.membergrid{grid-template-columns:repeat(2,minmax(0,1fr))}.projectgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.stats{grid-template-columns:repeat(2,1fr)}.layout2{grid-template-columns:1fr}}@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.mobilebar{display:flex;position:sticky;bottom:0;background:#17253f;color:white;padding:8px 6px;justify-content:space-around;z-index:3}.mobilebar button{background:transparent;border:0;color:#d1dcf0;display:grid;gap:3px;place-items:center;font-size:10px;padding:7px 5px}.mobilebar button span{font-size:19px}.mobilebar button.active{color:#fff;background:#2c4168;border-radius:9px}.topbar{padding:16px}.pagetitle{font-size:19px}.topbar .btn{padding:9px}.main{padding:19px 15px 32px}.greeting h1{font-size:21px}.membergrid,.projectgrid,.settingsbox{grid-template-columns:1fr}.stats{gap:8px}.stat{padding:16px}.stat .value{font-size:25px}.cta{align-items:flex-start;flex-direction:column}.rightactions .avatar{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar"><div class="brand"><div class="brandmark">✦</div><div><strong>MY AI OFFICE</strong><small>나만의 AI 회사</small></div></div><div><div class="sidehead">WORKSPACE</div><nav class="nav" id="sidebarNav"></nav></div><div class="sidefoot">✦ 화면 기능을 체험하는 <b>설계 시제품</b>입니다.<br>실제 GPT API 또는 외부 사이트와 연결되어 있지 않습니다.</div></aside>
<div class="content"><header class="topbar"><div><div class="breadcrumb">MY AI OFFICE / <span id="crumb">대시보드</span></div><div class="pagetitle" id="pagetitle">대시보드</div></div><div class="rightactions"><button class="btn primary" onclick="openTask()">＋ 업무 지시</button><div class="avatar">CEO</div></div></header><main class="main" id="main"></main></div>
</div>
<nav class="mobilebar" id="mobileNav"></nav>
<div id="modalRoot"></div>
<script>
const menu=[['dashboard','▦','대시보드'],['members','◉','AI 팀원'],['tasks','✓','업무 관리'],['projects','▤','프로젝트'],['history','◷','업무 기록'],['settings','⚙','설정']];
const seedMembers=[{id:'ceoai',name:'한실장',role:'AI 비서실장',emoji:'🤖',desc:'업무 분석, 팀원 배정, 작업 통합, 품질 검토',model:'업무 난도에 따라 선택',status:'활성',skills:'업무 조정 · 최종 보고'},{id:'research',name:'박리서치',role:'리서치팀장',emoji:'🔎',desc:'시장·경쟁사·디자인 공모전·채용 정보 조사',model:'리서치 최적화 모델',status:'활성',skills:'웹 검색 · 출처 검증'},{id:'plan',name:'김기획',role:'전략기획팀장',emoji:'🧠',desc:'브랜드 전략, 디자인 콘셉트, 제안서 구성',model:'추론 중심 모델',status:'활성',skills:'아이디어 · 기획서'},{id:'design',name:'이디자인',role:'디자인팀장',emoji:'🎨',desc:'BI/CI 방향성, 로고 브리프, 시각 시안 검토',model:'멀티모달 모델',status:'활성',skills:'브랜딩 · 시각 방향'},{id:'marketing',name:'최마케팅',role:'마케팅팀장',emoji:'📣',desc:'홍보 메시지, SNS 콘텐츠, 브랜드 카피라이팅',model:'텍스트 모델',status:'활성',skills:'SNS · 카피라이팅'}];
const seedProjects=[{id:'p1',title:'디자인 공모전 대응',description:'신규 모집 조사부터 브리프 분석과 제출안 기획까지',category:'브랜딩',progress:45},{id:'p2',title:'맞춤 채용공고 분석',description:'안양 통근권 채용 분석, 적합성·연봉 기준 정리',category:'리서치',progress:20},{id:'p3',title:'브랜드 포트폴리오',description:'진행한 디자인 작업을 브랜드 스토리로 정리',category:'디자인',progress:10}];
const seedTasks=[{id:'t1',title:'공모전 신규 모집 후보 조사',description:'일반인 참가 가능한 로고/BI/CI 공모전을 수집하고 공식 공고를 검증해 주세요.',project:'p1',agent:'research',status:'done',created:'샘플',priority:'보통'},{id:'t2',title:'로고 브랜딩 콘셉트 3종 개발',description:'연구 지원과 미래 비전이 느껴지는 심볼 콘셉트 세 가지를 구상해 주세요.',project:'p1',agent:'plan',status:'review',created:'샘플',priority:'높음'},{id:'t3',title:'최근 채용공고 비교표 구성',description:'안양 출발 1시간 내 통근, 고정급과 직무 적합성을 기준으로 공고를 분류해 주세요.',project:'p2',agent:'research',status:'active',created:'샘플',priority:'보통'}];
const storageKey='my-ai-office-demo-v1';
let store;try{store=JSON.parse(localStorage.getItem(storageKey))||null}catch(e){};
if(!store||!Array.isArray(store.members)||!Array.isArray(store.tasks)||!Array.isArray(store.projects))store={members:seedMembers,projects:seedProjects,tasks:seedTasks,events:[{id:'e1',time:'샘플',message:'공모전 조사 보고서 작성 완료',agent:'박리서치'},{id:'e2',time:'샘플',message:'로고 콘셉트 3종 검토 요청',agent:'김기획'},{id:'e3',time:'샘플',message:'채용공고 분석 진행 중',agent:'박리서치'}]};
let view='dashboard',filter='all';
function save(){try{localStorage.setItem(storageKey,JSON.stringify(store))}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function member(id){return store.members.find(m=>m.id===id)}function project(id){return store.projects.find(m=>m.id===id)}
function badge(status){const map={todo:['todo','배정 대기'],active:['active','진행 중'],review:['review','대표 검토'],done:['done','완료']};const b=map[status]||map.todo;return `<span class="pill ${b[0]}">${b[1]}</span>`}
function log(message,agent){store.events.unshift({id:uid('e'),time:new Date().toLocaleString('ko-KR'),message,agent});save()}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function go(which){view=which;render();window.scrollTo({top:0,behavior:'smooth'})}
function render(){let title=menu.find(x=>x[0]===view)?.[2]||'대시보드';document.getElementById('pagetitle').textContent=title;document.getElementById('crumb').textContent=title;for(const id of ['sidebarNav','mobileNav']){document.getElementById(id).innerHTML=menu.map(([key,icon,label])=>`<button class="${view===key?'active':''}" onclick="go('${key}')"><span>${icon}</span><span>${label}</span></button>`).join('')}let content={dashboard:dashboard,members:members,tasks:tasks,projects:projects,history:history,settings:settings}[view]();document.getElementById('main').innerHTML=`<div class="demo"><span>ⓘ 실제 GPT 연결 전인 인터랙티브 시제품입니다. 결과물과 업무 상태는 시뮬레이션 데이터입니다.</span><span>DEMO v1.0</span></div>${content}`}
function dashboard(){let counts={todo:0,active:0,review:0,done:0};store.tasks.forEach(x=>counts[x.status]++);return `<div class="greeting"><h1>대표님, 오늘의 AI 오피스입니다.</h1><p>팀원 업무를 지시하고 보고서를 검토하세요. 모든 결과물은 대표의 승인을 거칩니다.</p></div><div class="cta"><div><h2>팀원에게 새로운 임무를 지시하세요.</h2><p>예: 11월 신규 공모전 조사 후 전략기획팀에 콘셉트 개발 요청</p></div><button class="btn" onclick="openTask()">＋ 신규 임무 생성</button></div><div class="stats"><div class="stat"><div class="label">AI 팀원</div><div class="value">${store.members.length}</div><div class="sub">활성화된 가상 직원</div></div><div class="stat"><div class="label">진행 중 업무</div><div class="value">${counts.active}</div><div class="sub">결과 생성 중</div></div><div class="stat"><div class="label">승인 대기</div><div class="value">${counts.review}</div><div class="sub">대표 검토 필요</div></div><div class="stat"><div class="label">완료된 업무</div><div class="value">${counts.done}</div><div class="sub">승인 완료</div></div></div><div class="layout2"><section class="panel"><div class="section-head"><h2>최근 업무</h2><button class="btn small" onclick="go('tasks')">전체 보기 →</button></div><div class="tasks">${store.tasks.slice().reverse().slice(0,5).map(taskCard).join('')||'<div class="empty">아직 업무가 없습니다.</div>'}</div></section><section class="panel"><div class="section-head"><h2>우리 회사 업무 흐름</h2></div><div class="workflow">${[['01','대표 업무 지시','업무 목표, 기한, 우선순위를 입력합니다.'],['02','비서실장 배분','담당 팀원 및 실행 순서를 정합니다.'],['03','전문 AI 팀원 실행','각 팀원이 자료 조사, 기획, 검토합니다.'],['04','대표 승인','결과를 검토하고 승인 또는 수정 지시합니다.']].map(([n,t,d])=>`<div class="step"><div class="num">${n}</div><div><strong>${t}</strong><p>${d}</p></div></div>`).join('')}</div></section></div>`}
function taskCard(t){return `<div class="task"><div style="min-width:0"><strong>${esc(t.title)}</strong><small>${esc((member(t.agent)||{}).name||'비서실장')} · ${esc((project(t.project)||{}).title||'일반 업무')}</small></div><div class="taskright">${badge(t.status)}<button class="btn small" onclick="detail('${t.id}')">열기</button></div></div>`}
function members(){return `<div class="section-head"><div><h2>AI 팀원 관리</h2><p class="muted" style="font-size:12px">각 팀원의 역할, 전문 분야, 모델, 지침을 분리해 관리합니다.</p></div><button class="btn primary" onclick="openMember()">＋ 팀원 채용</button></div><div class="membergrid">${store.members.map(m=>`<article class="member"><div class="memberheader"><div class="emoji">${esc(m.emoji)}</div><div><h3>${esc(m.name)}</h3><span class="muted" style="font-size:12px">${esc(m.role)}</span></div></div><p>${esc(m.desc)}</p><div class="meta">주요 업무: ${esc(m.skills)}<br>AI 모델: ${esc(m.model)}</div><div class="memberfoot"><span class="pill done">● ${esc(m.status)}</span><button class="btn small" onclick="openMember('${m.id}')">설정</button></div></article>`).join('')}</div>`}
function tasks(){let items=store.tasks.filter(t=>filter==='all'||t.status===filter);return `<div class="section-head"><div><h2>업무 관리</h2><p class="muted" style="font-size:12px">단계별 현황을 확인하고 다음 단계로 진행해 보세요.</p></div><button class="btn primary" onclick="openTask()">＋ 업무 지시</button></div><div class="filters">${[['all','전체'],['todo','대기'],['active','진행 중'],['review','검토 필요'],['done','완료']].map(([v,l])=>`<button onclick="filter='${v}';render()" class="${filter===v?'selected':''}">${l}</button>`).join('')}</div><div class="panel tablewrap"><table class="datatable"><thead><tr><th>업무명</th><th>담당자</th><th>프로젝트</th><th>우선순위</th><th>상태</th><th>상세</th></tr></thead><tbody>${items.map(t=>`<tr><td><strong>${esc(t.title)}</strong><small>${esc(t.created)}</small></td><td>${esc(member(t.agent)?.name||'미배정')}</td><td>${esc(project(t.project)?.title||'일반')}</td><td>${esc(t.priority)}</td><td>${badge(t.status)}</td><td><button class="btn small" onclick="detail('${t.id}')">열기</button></td></tr>`).join('')}</tbody></table>${!items.length?'<div class="empty">이 상태의 업무가 없습니다.</div>':''}</div>`}
function projects(){return `<div class="section-head"><h2>프로젝트 포트폴리오</h2><button class="btn primary" onclick="openProject()">＋ 새 프로젝트</button></div><div class="projectgrid">${store.projects.map(p=>`<article class="project"><span class="pill">${esc(p.category)}</span><h3>${esc(p.title)}</h3><p>${esc(p.description)}</p><div class="progress"><div class="bar" style="width:${Math.max(0,Math.min(100,p.progress))}%"></div></div><div class="muted" style="font-size:11px">계획 진행률 ${p.progress}% · 연결된 업무 ${store.tasks.filter(t=>t.project===p.id).length}건</div><div style="margin-top:18px"><button class="btn small" onclick="go('tasks')">업무 보기</button></div></article>`).join('')}</div>`}
function history(){return `<section class="panel"><div class="section-head"><h2>업무 활동 기록</h2><button class="btn small" onclick="resetDemo()">시제품 초기화</button></div><p class="muted" style="font-size:12px">모든 상태 변경과 승인 활동을 기록합니다. 아래는 브라우저에 저장된 시뮬레이션 로그입니다.</p><div class="timeline" style="margin-top:22px">${store.events.map(e=>`<div class="event"><div class="dot"></div><div class="body"><strong>${esc(e.message)}</strong><p>${esc(e.agent)} · ${esc(e.time)}</p></div></div>`).join('')}</div></section>`}
function settings(){return `<div class="settingsbox"><section class="config"><strong>🔐 OpenAI API 연결</strong><span class="pill review">미연결</span><p>정식 구현 시 API 키를 서버 환경변수에 등록하고, 브라우저에서는 서버 API만 호출합니다. 이 시제품에서는 API 키를 입력받거나 저장하지 않습니다.</p><div class="detailbox">OPENAI_API_KEY=서버에만 저장<br>POST /api/tasks/:id/run<br>OpenAI Agents SDK → 전문 팀원 호출</div></section><section class="config"><strong>🛡️ 승인·비용 제어</strong><p>최종 제출, 이메일 발송, 유료 구매, 외부 파일 공유는 대표 승인 후에만 실행합니다. 월 예산 한도, 작업별 토큰 상한, 실패 재시도 제한을 설정할 수 있게 설계합니다.</p><div class="detailbox">업무 실행: 사용자 확인<br>외부 전송: 별도 승인<br>API 사용량: 프로젝트별 기록</div></section><section class="config"><strong>🗂️ 데이터 저장</strong><p>정식 서비스에서는 Supabase에 업무, 팀원 지침, 파일, 보고서, 승인 이력을 보관합니다. 사용자별 권한 관리와 Row Level Security를 적용합니다.</p><div class="detailbox">PostgreSQL + Storage + Auth<br>Agents / Tasks / Runs / Artifacts / Approvals</div></section><section class="config"><strong>🧪 시제품 데이터</strong><p>이 화면에서 작성한 팀원과 업무는 현재 브라우저의 로컬 저장소에만 남습니다. 다른 기기와 동기화되지 않습니다.</p><button class="btn danger" onclick="resetDemo()">샘플 데이터 초기화</button></section></div>`}
function openModal(html){document.getElementById('modalRoot').innerHTML=`<div class="modalwrap" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openTask(){openModal(`<h2>새 업무 지시</h2><div class="hint">대표님의 요청을 입력합니다. 정식 서비스에서는 비서실장이 업무 계획을 세우고 담당 AI에게 자동 배정합니다.</div><form onsubmit="submitTask(event)"><div class="field"><label for="tasktitle">업무명</label><input id="tasktitle" required maxlength="100" placeholder="예: 신규 BI 공모전 조사 및 기획"></div><div class="field"><label for="taskdesc">업무 내용</label><textarea id="taskdesc" required placeholder="목표, 결과물 형식, 필요한 조건 등을 자세히 입력하세요."></textarea></div><div class="field"><label for="taskproject">프로젝트</label><select id="taskproject">${store.projects.map(p=>`<option value="${p.id}">${esc(p.title)}</option>`).join('')}</select></div><div class="field"><label for="taskagent">담당 팀원</label><select id="taskagent">${store.members.map(m=>`<option value="${m.id}">${esc(m.name)} (${esc(m.role)})</option>`).join('')}</select></div><div class="field"><label for="taskpriority">우선순위</label><select id="taskpriority"><option>보통</option><option>높음</option><option>낮음</option></select></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">취소</button><button type="submit" class="btn primary">업무 등록</button></div></form>`)}
function submitTask(ev){ev.preventDefault();let t={id:uid('t'),title:document.getElementById('tasktitle').value.trim(),description:document.getElementById('taskdesc').value.trim(),project:document.getElementById('taskproject').value,agent:document.getElementById('taskagent').value,priority:document.getElementById('taskpriority').value,status:'todo',created:new Date().toLocaleString('ko-KR')};if(!t.title||!t.description)return;store.tasks.unshift(t);log('업무 지시 등록: '+t.title,'대표');save();closeModal();go('tasks')}
function openMember(id){let m=store.members.find(x=>x.id===id);openModal(`<h2>${m?'AI 팀원 설정':'AI 팀원 채용'}</h2><div class="hint">팀원별 역할과 지침을 정의합니다. 현재 변경은 시제품에만 반영됩니다.</div><form onsubmit="submitMember(event,'${id||''}')"><div class="field"><label for="memberName">팀원 이름</label><input id="memberName" required value="${esc(m?.name||'')}" placeholder="예: 정분석"></div><div class="field"><label for="memberRole">직책</label><input id="memberRole" required value="${esc(m?.role||'')}" placeholder="예: 데이터 분석팀장"></div><div class="field"><label for="memberEmoji">프로필 이모지</label><input id="memberEmoji" maxlength="4" value="${esc(m?.emoji||'📊')}"></div><div class="field"><label for="memberDesc">업무 지침 (요약)</label><textarea id="memberDesc" required>${esc(m?.desc||'')}</textarea></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">취소</button><button type="submit" class="btn primary">저장</button></div></form>`)}
function submitMember(ev,id){ev.preventDefault();let m=store.members.find(x=>x.id===id);let data={name:document.getElementById('memberName').value.trim(),role:document.getElementById('memberRole').value.trim(),emoji:document.getElementById('memberEmoji').value.trim()||'🤖',desc:document.getElementById('memberDesc').value.trim()};if(!data.name||!data.role||!data.desc)return;if(m)Object.assign(m,data);else store.members.push({id:uid('a'),...data,model:'미설정',status:'활성',skills:'직접 설정'});log((m?'팀원 설정 변경: ':'신규 팀원 채용: ')+data.name,'대표');save();closeModal();go('members')}
function openProject(){openModal(`<h2>새 프로젝트</h2><div class="hint">업무와 팀원들을 하나의 프로젝트로 묶습니다.</div><form onsubmit="submitProject(event)"><div class="field"><label for="projTitle">프로젝트명</label><input id="projTitle" required></div><div class="field"><label for="projDesc">설명</label><textarea id="projDesc" required></textarea></div><div class="field"><label for="projCategory">분류</label><select id="projCategory"><option>브랜딩</option><option>리서치</option><option>마케팅</option><option>디자인</option><option>기타</option></select></div><div class="modalactions"><button type="button" class="btn" onclick="closeModal()">취소</button><button type="submit" class="btn primary">프로젝트 추가</button></div></form>`)}
function submitProject(ev){ev.preventDefault();let title=document.getElementById('projTitle').value.trim(),desc=document.getElementById('projDesc').value.trim();if(!title||!desc)return;store.projects.unshift({id:uid('p'),title,description:desc,category:document.getElementById('projCategory').value,progress:0});log('새 프로젝트 생성: '+title,'대표');save();closeModal();go('projects')}
function detail(id){let t=store.tasks.find(t=>t.id===id);if(!t)return;let action={todo:`<button class="btn primary" onclick="advance('${id}')">데모: 업무 시작</button>`,active:`<button class="btn primary" onclick="advance('${id}')">데모: 결과 제출</button>`,review:`<button class="btn soft" onclick="revise('${id}')">수정 요청</button><button class="btn primary" onclick="advance('${id}')">대표 승인</button>`,done:`<span class="pill done">승인 완료</span>`}[t.status];openModal(`<h2>${esc(t.title)}</h2><div class="hint">${badge(t.status)}　${esc((member(t.agent)||{}).name||'미배정')} · ${esc(project(t.project)?.title||'일반 업무')}</div><div class="detailbox">${esc(t.description)}</div><div class="detailsteps"><span>① 업무 지시</span><span>② AI 실행</span><span>③ 결과 검토</span><span>④ 대표 승인</span></div><p class="muted" style="font-size:12px;line-height:1.7">이 화면의 상태 변경은 실제 AI 작업 없이 진행되는 흐름 시뮬레이션입니다. 연결 후에는 각 단계에서 실행 로그, 자료 출처, 생성 파일과 비용을 보여줍니다.</p><div class="modalactions"><button class="btn" onclick="closeModal()">닫기</button>${action}</div>`)}
function advance(id){let t=store.tasks.find(x=>x.id===id);if(!t)return;let next={todo:'active',active:'review',review:'done'}[t.status];if(!next)return;t.status=next;log(({active:'업무 실행 시작(데모)',review:'결과 제출(데모)',done:'대표 승인 완료'})[next]+': '+t.title,(next==='done'?'대표':member(t.agent)?.name||'AI 팀원'));save();closeModal();render();detail(id)}
function revise(id){let t=store.tasks.find(x=>x.id===id);if(!t)return;t.status='active';log('수정 요청(데모): '+t.title,'대표');save();closeModal();render();detail(id)}
function resetDemo(){if(!confirm('시제품 데이터를 초기화하시겠습니까?'))return;localStorage.removeItem(storageKey);location.reload()}
render();
</script>
</body></html>
